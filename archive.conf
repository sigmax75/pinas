# PiNAS Archive Configuration

# Source (hot storage - SSD)
SOURCE_DIR="/mnt/ssd"

# Destination (cold storage - HDD)
ARCHIVE_DIR="/mnt/archive"

# Files older than this (days) will be archived
AGE_DAYS=365

# File extensions to archive (data files only)
# Space-separated, lowercase
ARCHIVE_EXTENSIONS="mp4 mov avi mkv wmv flv webm jpg jpeg png gif bmp heic heif tiff tif raw cr2 nef mp3 wav m4a flac ogg aac wma aiff pdf doc docx xls xlsx ppt pptx odt ods odp csv txt rtf zip rar 7z tar gz bak"

# Directories to exclude (relative to SOURCE_DIR)
# Space-separated
EXCLUDE_DIRS="lost+found .Trash-1000"

# Log file
LOG_FILE="/var/log/pinas-archive.log"

# Dry run mode (set to "yes" to preview without moving)
DRY_RUN="yes"
